[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/content",
    "crates/config",
    "crates/storage",
    "crates/capture",
    "crates/detection",
    "crates/processors",
    "crates/ipc",
    "crates/cli",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["koresent"]
repository = "https://github.com/koresent/kclip"

[workspace.dependencies]
app-core = { path = "crates/app-core" }
content = { path = "crates/content" }
kclip-config = { path = "crates/config" }
storage = { path = "crates/storage" }
capture = { path = "crates/capture" }
detection = { path = "crates/detection" }
processors = { path = "crates/processors" }
kclip-ipc = { path = "crates/ipc" }
kclip-ui = { path = "crates/ui" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
directories = "5.0"
tempfile = "3.12"
rustix = { version = "1.0", features = ["pipe", "event"] }
crossbeam-channel = "0.5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp", "ico"] }
clap = { version = "4.5", features = ["derive"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

